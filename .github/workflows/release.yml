on:
  repository_dispatch:
    types: release

name: Release

permissions: {}
jobs:
  release:
    permissions:
      contents: write
      pull-requests: write

    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        ref: master
        token: ${{ secrets.GH_TOKEN }}
    - name: Set variables
      id: version
      run: |
        echo "addon=${{ github.event.client_payload.version }}" >> "$GITHUB_OUTPUT"
        echo "z2m=$(echo "${{ github.event.client_payload.version }}" | cut -d - -f 1)" >> "$GITHUB_OUTPUT"
    - name: Set version and update release
      run: |
        set -euo pipefail
        ADDONS=(zigbee2mqtt-garage zigbee2mqtt-apartment zigbee2mqtt-balcony zigbee2mqtt-gazebo zigbee2mqtt-attic zigbee2mqtt-mc zigbee2mqtt-temp)
        for addon in "${ADDONS[@]}"; do
          jq '.version = "${{ steps.version.outputs.addon }}"' "$addon/config.json" > "$addon/config.json.tmp"
          mv "$addon/config.json.tmp" "$addon/config.json"
          echo -e "## ${{ steps.version.outputs.addon }}\n- Same Zigbee2MQTT version as upstream image [\`${{ steps.version.outputs.z2m }}\`](https://github.com/Koenkk/zigbee2mqtt/releases/tag/${{ steps.version.outputs.z2m }})\n" | cat - "$addon/CHANGELOG.md" > "$addon/CHANGELOG.md.tmp"
          mv "$addon/CHANGELOG.md.tmp" "$addon/CHANGELOG.md"
        done
    - uses: stefanzweifel/git-auto-commit-action@v5
      with:
        commit_message: "v${{ steps.version.outputs.addon }}"
    - uses: ncipollo/release-action@v1
      with:
        tag: "v${{ steps.version.outputs.addon }}"
        body: |
          - Bumped add-on metadata version to match Zigbee2MQTT [`${{ steps.version.outputs.z2m }}`](https://github.com/Koenkk/zigbee2mqtt/releases/tag/${{ steps.version.outputs.z2m }}) (same Docker image as official add-on: `ghcr.io/zigbee2mqtt/zigbee2mqtt-{arch}`).
          - Updated: **Garage**, **Apartment**, **Balcony**, **Gazebo**, **Attic**, **MC**, **Temp**.
        token: ${{ secrets.GH_TOKEN }}
