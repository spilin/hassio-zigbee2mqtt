name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate add-on config.json files
        run: |
          set -euo pipefail
          for dir in zigbee2mqtt-garage zigbee2mqtt-balcony zigbee2mqtt-mc; do
            test -f "$dir/config.json"
            jq empty "$dir/config.json"
            echo "OK: $dir/config.json"
          done
